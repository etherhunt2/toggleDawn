<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline // ToggleDawn Command</title>
  <meta name="theme-color" content="#060e1a">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #060e1a;
      --card-bg: rgba(10, 25, 47, 0.7);
      --cyan: #00f0ff;
      --amber: #f59e0b;
      --red: #ef4444;
      --green: #00ff9d;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .hud-box {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      padding: 36px 28px;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 20px rgba(0, 240, 255, 0.03);
      backdrop-filter: blur(16px);
    }
    .hud-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--cyan);
      border-style: solid;
      pointer-events: none;
    }
    .top-left { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .top-right { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .bottom-left { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .bottom-right { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
    
    .icon-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--red);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 0 16px 4px rgba(239, 68, 68, 0.2); }
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--amber);
      background: rgba(245, 158, 11, 0.12);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(245, 158, 11, 0.25);
      margin-bottom: 14px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .action-btn {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(0, 240, 255, 0.05));
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      user-select: none;
    }
    .action-btn:hover:not(:disabled) {
      background: var(--cyan);
      color: #02060d;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.5);
    }
    .action-btn:active:not(:disabled) {
      transform: scale(0.97);
    }
    .action-btn.loading {
      opacity: 0.85;
      cursor: wait;
      border-color: rgba(0, 240, 255, 0.5);
      color: var(--cyan);
    }
    .action-btn.loading svg {
      animation: spin 0.8s linear infinite;
    }
    .action-btn.success {
      background: rgba(0, 255, 157, 0.2);
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .hud-feedback {
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 0.05em;
      min-height: 18px;
      transition: color 0.2s;
    }
    .hud-feedback.error {
      color: var(--red);
    }
    .hud-feedback.info {
      color: var(--cyan);
    }
    .hud-feedback.success {
      color: var(--green);
    }
    .status-bar {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="hud-box">
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <div class="icon-container">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <span class="tag">Link Terminated // Offline Mode</span>
    <h1>Telemetry Uplink Lost</h1>
    <p>
      ToggleDawn cannot establish connection to the orbital neural node. 
      Cached assets and local storage are preserved on this device. 
      Please verify your network link.
    </p>

    <button id="uplink-btn" class="action-btn" onclick="reEstablishUplink()">
      <svg id="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
      </svg>
      <span id="btn-text">Re-Establish Uplink</span>
    </button>

    <div id="hud-feedback" class="hud-feedback"></div>

    <div class="status-bar">
      <span id="status-state">STATE: STANDBY</span>
      <span id="status-retry">AUTO-RETRY: ACTIVE</span>
    </div>
  </div>

  <script>
    let isReconnecting = false;
    let autoRetryTimer = null;
    let retryCount = 0;

    // Resolve target path so we never get trapped refreshing /offline.html
    function getDestinationUrl() {
      const currentPath = window.location.pathname;
      if (currentPath && !currentPath.includes('offline')) {
        return currentPath + window.location.search + window.location.hash;
      }
      if (document.referrer) {
        try {
          const ref = new URL(document.referrer);
          if (ref.origin === window.location.origin && !ref.pathname.includes('offline')) {
            return ref.pathname + ref.search + ref.hash;
          }
        } catch (_) {}
      }
      return '/';
    }

    // Lightweight connectivity probe — tries multiple strategies
    async function probeServer() {
      const bustCache = '_t=' + Date.now();

      // Strategy 1: Probe the origin root with a HEAD request (bypasses SW for /api)
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 4000);
        const r = await fetch('/api/users/me?' + bustCache, {
          method: 'HEAD',
          cache: 'no-store',
          signal: ctrl.signal,
        });
        clearTimeout(tid);
        // Any HTTP status means the server is alive (even 401/404)
        if (r.status) return true;
      } catch (_) {}

      // Strategy 2: Check navigator.onLine — quick sanity check
      if (!navigator.onLine) return false;

      // Strategy 3: Fetch the target page directly (HEAD) bypassing SW cache
      try {
        const target = getDestinationUrl();
        const ctrl2 = new AbortController();
        const tid2 = setTimeout(() => ctrl2.abort(), 4000);
        const r2 = await fetch(target + (target.includes('?') ? '&' : '?') + bustCache, {
          method: 'HEAD',
          cache: 'no-store',
          signal: ctrl2.signal,
        });
        clearTimeout(tid2);
        if (r2.status && r2.status < 500) return true;
      } catch (_) {}

      // Strategy 4: Try fetching favicon (small, always present on a live server)
      try {
        const ctrl3 = new AbortController();
        const tid3 = setTimeout(() => ctrl3.abort(), 3000);
        const r3 = await fetch('/favicon.ico?' + bustCache, {
          method: 'HEAD',
          cache: 'no-store',
          signal: ctrl3.signal,
        });
        clearTimeout(tid3);
        if (r3.status && r3.status < 500) return true;
      } catch (_) {}

      return false;
    }

    async function reEstablishUplink() {
      if (isReconnecting) return;
      isReconnecting = true;
      retryCount++;

      const btn = document.getElementById('uplink-btn');
      const btnText = document.getElementById('btn-text');
      const stateEl = document.getElementById('status-state');
      const feedbackEl = document.getElementById('hud-feedback');

      btn.classList.add('loading');
      btn.classList.remove('success');
      btn.disabled = true;
      btnText.textContent = 'VERIFYING UPLINK...';
      stateEl.textContent = 'STATE: PROBING SERVER...';
      stateEl.style.color = 'var(--cyan)';
      feedbackEl.className = 'hud-feedback info';
      feedbackEl.textContent = 'Probing server node... (attempt ' + retryCount + ')';

      const targetPath = getDestinationUrl();
      const serverAlive = await probeServer();

      if (serverAlive) {
        onUplinkSuccess(targetPath);
        return;
      }

      // Uplink probe failed — server is still offline
      isReconnecting = false;
      btn.disabled = false;
      btn.classList.remove('loading');
      btnText.textContent = 'RE-ESTABLISH UPLINK';
      stateEl.textContent = 'STATE: UNREACHABLE';
      stateEl.style.color = 'var(--red)';
      feedbackEl.className = 'hud-feedback error';
      feedbackEl.textContent = navigator.onLine
        ? 'Server unreachable. Ensure dev server (pnpm dev) is running.'
        : 'Device is offline. Check your Wi-Fi or mobile data.';

      // Shake animation
      btn.animate([
        { transform: 'translateX(0)' },
        { transform: 'translateX(-6px)' },
        { transform: 'translateX(6px)' },
        { transform: 'translateX(-4px)' },
        { transform: 'translateX(4px)' },
        { transform: 'translateX(0)' }
      ], { duration: 350 });
    }

    function onUplinkSuccess(targetPath) {
      const btn = document.getElementById('uplink-btn');
      const btnText = document.getElementById('btn-text');
      const stateEl = document.getElementById('status-state');
      const feedbackEl = document.getElementById('hud-feedback');

      btn.classList.remove('loading');
      btn.classList.add('success');
      btnText.textContent = 'UPLINK RESTORED';
      stateEl.textContent = 'STATE: ONLINE // REDIRECTING...';
      stateEl.style.color = 'var(--green)';
      feedbackEl.className = 'hud-feedback success';
      feedbackEl.textContent = 'Connection active. Transferring to HUD...';

      // Clear stale SW cache so we get fresh pages
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
        navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_CACHE' });
      }

      // Hard navigate — replace avoids back-button returning to offline.html
      setTimeout(() => {
        window.location.replace(targetPath);
      }, 400);
    }

    // Auto-retry polling every 5 seconds
    function startAutoRetry() {
      if (autoRetryTimer) clearInterval(autoRetryTimer);
      document.getElementById('status-retry').textContent = 'AUTO-RETRY: ACTIVE';
      autoRetryTimer = setInterval(async () => {
        if (isReconnecting) return;
        const alive = await probeServer();
        if (alive) {
          console.log('[ToggleDawn PWA] Background auto-retry succeeded. Reconnecting...');
          clearInterval(autoRetryTimer);
          reEstablishUplink();
        }
      }, 5000);
    }

    startAutoRetry();

    // Trigger on browser 'online' event (instant reconnect when network restores)
    window.addEventListener('online', () => {
      console.log('[ToggleDawn PWA] Online event triggered. Re-establishing uplink...');
      // Small delay to let DNS/routes settle
      setTimeout(() => reEstablishUplink(), 500);
    });
  </script>
</body>
</html>
